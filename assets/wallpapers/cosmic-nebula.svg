<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#140f2b"/>
      <stop offset="45%" stop-color="#0b0818"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>
    <radialGradient id="nebula-purple" cx="35%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-magenta" cx="68%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-cyan" cx="55%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stardust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#space-bg)"/>

  <!-- Stardust Dust Filament Ribbons -->
  <path d="M-100 200 C 400 450 800 150 1300 480 C 1650 700 1900 620 2050 550 L 2050 1100 L -100 1100 Z" fill="url(#stardust)"/>

  <!-- Glowing Nebulae -->
  <circle cx="680" cy="420" r="580" fill="url(#nebula-purple)"/>
  <circle cx="1320" cy="620" r="520" fill="url(#nebula-magenta)"/>
  <circle cx="1050" cy="320" r="460" fill="url(#nebula-cyan)"/>

  <!-- Stars & Diamond Glints -->
  <g fill="#ffffff">
    <circle cx="150" cy="220" r="1.2" opacity="0.6"/>
    <circle cx="320" cy="110" r="1.5" opacity="0.8"/>
    <circle cx="480" cy="380" r="2.0" opacity="0.7"/>
    <circle cx="620" cy="190" r="1.1" opacity="0.5"/>
    <circle cx="790" cy="310" r="1.8" opacity="0.9"/>
    <circle cx="910" cy="140" r="1.3" opacity="0.7"/>
    <circle cx="1060" cy="280" r="2.2" opacity="0.95"/>
    <circle cx="1180" cy="450" r="1.4" opacity="0.6"/>
    <circle cx="1350" cy="210" r="1.8" opacity="0.8"/>
    <circle cx="1520" cy="360" r="1.2" opacity="0.5"/>
    <circle cx="1690" cy="180" r="2.0" opacity="0.9"/>
    <circle cx="1810" cy="410" r="1.5" opacity="0.7"/>

    <circle cx="280" cy="740" r="1.4" opacity="0.7"/>
    <circle cx="510" cy="860" r="1.6" opacity="0.6"/>
    <circle cx="740" cy="690" r="1.2" opacity="0.5"/>
    <circle cx="980" cy="820" r="1.9" opacity="0.8"/>
    <circle cx="1220" cy="730" r="1.3" opacity="0.6"/>
    <circle cx="1460" cy="890" r="2.1" opacity="0.9"/>
    <circle cx="1680" cy="770" r="1.5" opacity="0.7"/>
    <circle cx="1830" cy="880" r="1.2" opacity="0.5"/>
  </g>

  <!-- Large Feature Star / Diamond -->
  <g transform="translate(1060, 280)" fill="#ffffff" opacity="0.9">
