<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="solar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31103f"/>
      <stop offset="35%" stop-color="#701a75"/>
      <stop offset="65%" stop-color="#be185d"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="solar-core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#31103f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solar-wave1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#solar-bg)"/>
  <rect width="1920" height="1080" fill="url(#solar-core)"/>

  <!-- Fluid Solar Flare Ribbons -->
  <path d="M-100 680 C 420 480 840 820 1350 620 C 1720 460 1900 640 2050 580 L 2050 1100 L -100 1100 Z" fill="url(#solar-wave1)"/>
  
  <path d="M-100 860 C 350 720 780 940 1280 810 C 1680 690 1880 860 2050 790 L 2050 1100 L -100 1100 Z" fill="#facc15" opacity="0.3"/>

  <!-- Ambient Light Orbs -->
  <g fill="#fef08a" opacity="0.5">
    <circle cx="480" cy="280" r="4.0"/>
    <circle cx="720" cy="180" r="2.5"/>
    <circle cx="1040" cy="340" r="3.5"/>
    <circle cx="1420" cy="220" r="2.0"/>
    <circle cx="1680" cy="380" r="3.0"/>
  </g>
</svg>
