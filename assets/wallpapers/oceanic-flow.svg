<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c43"/>
      <stop offset="40%" stop-color="#053f5e"/>
      <stop offset="75%" stop-color="#115173"/>
      <stop offset="100%" stop-color="#021d2d"/>
    </linearGradient>
    <linearGradient id="wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008891"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#06d6a0"/>
    </linearGradient>
    <linearGradient id="wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03045e"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#0096c7"/>
    </linearGradient>
    <linearGradient id="wave-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#48cae4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#90e0ef" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#ocean-bg)"/>

  <!-- Flowing Organic Ribbon 1 -->
  <path d="M-100 850 C 350 920 650 620 1050 720 C 1450 820 1650 650 2050 700 L 2050 1100 L -100 1100 Z" fill="url(#wave-2)" opacity="0.85"/>

  <!-- Flowing Organic Ribbon 2 -->
  <path d="M-100 680 C 420 540 780 840 1250 640 C 1620 480 1820 620 2050 560 L 2050 1100 L -100 1100 Z" fill="url(#wave-1)" opacity="0.75"/>

