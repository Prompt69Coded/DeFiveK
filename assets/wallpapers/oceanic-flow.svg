  <path d="M-100 480 C 380 320 840 560 1320 410 C 1720 290 1880 440 2050 390 L 2050 780 C 1750 720 1520 860 1150 720 C 720 580 320 740 -100 620 Z" fill="url(#wave-3)" opacity="0.45"/>

  <!-- Subtle Translucent Aqua Accents -->
  <path d="M-50 280 C 450 160 920 380 1420 260 C 1780 180 1950 290 2050 240 L 2050 340 C 1820 420 1550 320 1120 460 C 680 600 250 420 -50 480 Z" fill="#90e0ef" opacity="0.18"/>

  <!-- Ambient Caustic Depth Particles -->
  <g fill="#90e0ef" opacity="0.4">
    <circle cx="340" cy="240" r="3.0"/>
    <circle cx="580" cy="380" r="2.0"/>
    <circle cx="890" cy="210" r="2.5"/>
    <circle cx="1240" cy="320" r="3.5"/>
    <circle cx="1620" cy="220" r="2.0"/>
    <circle cx="1780" cy="360" r="3.0"/>
