<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="75%" stop-color="#0e1a38"/>
      <stop offset="100%" stop-color="#081023"/>
    </linearGradient>
    <linearGradient id="aurora-beam1" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora-beam2" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.40"/>
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mount-near" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="mount-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121b33"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#sky-grad)"/>

  <!-- Distant Starlight -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="210" cy="95" r="1.5"/>
    <circle cx="340" cy="180" r="1.2"/>
    <circle cx="580" cy="80" r="2.0"/>
    <circle cx="890" cy="140" r="1.5"/>
    <circle cx="1120" cy="70" r="1.2"/>
    <circle cx="1380" cy="190" r="1.8"/>
    <circle cx="1620" cy="110" r="1.4"/>
    <circle cx="1780" cy="220" r="1.2"/>
    <circle cx="450" cy="260" r="1.2"/>
    <circle cx="1250" cy="240" r="1.5"/>
    <circle cx="950" cy="60" r="2.2" opacity="0.9"/>
  </g>

  <!-- Aurora Ribbons -->
  <rect width="1920" height="1080" fill="url(#center-glow)"/>
  
  <path d="M-100 550 Q 300 180 800 320 T 1700 220 Q 1900 240 2100 360 L 2100 0 L -100 0 Z" fill="url(#aurora-beam1)"/>
  <path d="M-100 480 Q 450 120 1050 260 T 1950 180 L 2100 220 L 2100 0 L -100 0 Z" fill="url(#aurora-beam2)"/>
  
  <!-- Subtle Second Harmonic -->
  <path d="M0 420 C 350 260 720 380 1150 220 C 1580 140 1800 280 2000 240 L 2000 0 L 0 0 Z" fill="#06b6d4" opacity="0.12"/>

  <!-- Mountain Silhouette (Far) -->
  <path d="M-50 1080 L-50 680 L220 540 L480 640 L760 490 L1080 620 L1340 470 L1620 580 L1880 490 L2000 560 L2000 1080 Z" fill="url(#mount-far)"/>

  <!-- Mountain Silhouette (Foreground) -->
  <path d="M-50 1080 L-50 780 L180 690 L390 820 L680 640 L950 760 L1240 610 L1520 730 L1800 630 L2000 710 L2000 1080 Z" fill="url(#mount-near)"/>

  <!-- Subtle Lake Reflection Glow -->
  <rect y="920" width="1920" height="160" fill="#06b6d4" opacity="0.06"/>
</svg>
