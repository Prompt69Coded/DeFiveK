<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="dune-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#4c1d95"/>
      <stop offset="65%" stop-color="#831843"/>
      <stop offset="85%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <radialGradient id="dune-sun" cx="72%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="dune-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="dune-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="dune-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#260e04"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#dune-sky)"/>

  <!-- Desert Sun & Ambient Radiance -->
  <rect width="1920" height="1080" fill="url(#dune-sun)"/>
  <circle cx="1380" cy="580" r="90" fill="#fff7ed" opacity="0.85"/>

  <!-- Distant Dunes -->
  <path d="M-100 820 Q 420 620 950 780 T 2050 710 L 2050 1100 L -100 1100 Z" fill="url(#dune-3)"/>

  <!-- Midground Rolling Ridge with Sharp Crest -->
  <path d="M-100 920 Q 380 720 920 860 Q 1420 980 2050 780 L 2050 1100 L -100 1100 Z" fill="url(#dune-2)"/>
  <path d="M920 860 Q 1420 980 2050 780 L 2050 1100 L 920 1100 Z" fill="url(#dune-shadow)" opacity="0.45"/>

  <!-- Foreground Sweeping Dune -->
  <path d="M-100 780 Q 520 940 1150 820 Q 1650 720 2050 880 L 2050 1100 L -100 1100 Z" fill="url(#dune-1)"/>

  <!-- Soft Evening Constellations -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="240" cy="140" r="1.6"/>
    <circle cx="580" cy="90" r="2.0"/>
    <circle cx="920" cy="180" r="1.4"/>
    <circle cx="1180" cy="80" r="1.8"/>
    <circle cx="1520" cy="150" r="1.5"/>
    <circle cx="1780" cy="100" r="2.2"/>
  </g>
</svg>
